# CI. Porteiro do merge: links válidos, registro de fontes e citações consistentes, núcleo C++ determinístico
# (mesmo hash no Linux e no Windows) e Godot fixado e testável.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo no mesmo PR cancela a execução anterior, que já ficou velha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Versões fixadas: ações na série node24 e runner Ubuntu 24.04 (o rótulo ubuntu-latest muda de sistema sozinho).
# Os nomes dos jobs serão checks obrigatórios da regra da main: renomear exige atualizar a regra.

jobs:
  links:
    name: Links internos dos .md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Testes do verificador de links
        run: python3 tools/test_checar_links.py
      - name: Links internos entre os .md existem
        run: python3 tools/checar_links.py

  fontes:
    name: Fontes (registro e citações)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Testes do verificador de fontes
        run: python3 tools/test_conferir_fontes.py
      - name: Registro válido e toda citação aponta para uma fonte registrada
        run: python3 tools/conferir_fontes.py

  nucleo-linux:
    name: Núcleo C++ (Linux, determinismo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: mpmath para medir o erro em ulp
        run: python3 -m pip install mpmath==1.3.0
      - name: g++ -O2/-O0, clang++ -O2, g++ -O3 -march=haswell; testes, hash dos vetores e erro em ulp
        run: tools/testar_nucleo.sh

  nucleo-windows:
    name: Núcleo C++ (Windows, MinGW)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Compila com MinGW-w64 (mesma família de compilador das builds oficiais do Godot) e confere o hash
        working-directory: engine/native
        run: |
          GXX=/c/mingw64/bin/g++.exe; [ -x "$GXX" ] || GXX=g++
          "$GXX" --version | head -1
          FLAGS="-std=c++17 -O2 -ffp-contract=off -fno-fast-math -Wall -Wextra -Iinclude"
          "$GXX" $FLAGS src/*.cpp tests/*.cpp -o run_tests.exe -static
          "$GXX" $FLAGS src/detmath.cpp tools/detmath_vectors.cpp -o detmath_vectors.exe -static
          ./run_tests.exe
          obtido="$(./detmath_vectors.exe | tail -1 | tr -d '\r' | awk '{print $2}')"
          esperado="$(tr -d '[:space:]' < golden/detmath_vectors.fnv)"
          echo "Windows: $obtido  esperado: $esperado"
          [ "$obtido" = "$esperado" ]

  godot:
    name: Godot (versão, SHA-512 e gdUnit4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache do Godot (chave = SHA-512 fixada)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ hashFiles('tools/ambiente/versoes.env') }}
      - name: Baixa o Godot da Release oficial, confere a soma e a versão headless
        run: |
          G="$(tools/ambiente/instalar_godot.sh "$RUNNER_TEMP/godot" | tail -1)"  # falha do script falha o passo
          echo "GODOT=$G" >> "$GITHUB_ENV"
      - name: Testes gdUnit4 da cena de fumaça (prova o addon fixado no runner)
        working-directory: tools/ambiente/fumaca
        run: |
          ../instalar_gdunit4.sh .
          "$GODOT" --headless --path . --import
          GODOT_BIN="$GODOT" addons/gdUnit4/runtest.sh --headless --ignoreHeadlessMode -a res://tests
