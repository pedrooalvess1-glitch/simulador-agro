name: Desempenho
description: FPS baixo, travamento, carga lenta ou memória alta.
title: "perf: "
labels: [desempenho]
body:
  - type: markdown
    attributes:
      value: "O limite de cada métrica (FPS, triângulos, draw calls, carga) está no [orçamento de desempenho](https://github.com/pedrooalvess1-glitch/simulador-agro/blob/main/docs/00_INDICE.md#33-orçamento-de-desempenho)."
  - type: textarea
    id: onde
    attributes:
      label: Onde e quando
      description: "Cenário, área da propriedade, dia da safra e o que estava na tela (ex.: avanço rápido de dias)."
    validations:
      required: true
  - type: textarea
    id: painel
    attributes:
      label: Painel F3
      description: FPS, draw calls, memória de vídeo e GPU (o agente lê pelo controle da tela).
  - type: input
    id: perfil
    attributes:
      label: Perfil de qualidade e versão
      description: "Ex.: Leve, v0.1.0"
